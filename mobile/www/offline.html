<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OpenPrep</title>
<body style="margin:0;height:100vh;display:grid;place-items:center;background:#fff;color:#0a0a0a;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box">
<div>
  <h1 style="font-weight:600;font-size:24px">You're offline</h1>
  <p id="msg" style="color:#737373">OpenPrep needs the internet to load your practice. Check your connection and try again.</p>
  <button id="retry" style="height:48px;padding:0 24px;border-radius:14px;border:0;background:#0a0a0a;color:#fff;font-weight:600;font-size:16px">Try again</button>
</div>
<script>
  var home = "https://openprep-opal.vercel.app/dashboard";
  document.getElementById("retry").onclick = function () { location.href = home; };
  // Called by the app when a test is locked: back to the test (the app also retries it every few seconds).
  window.openprepTest = function (test) {
    document.getElementById("msg").textContent = "Your test is still running and stays locked. Reconnecting…";
    document.getElementById("retry").onclick = function () { location.href = test; };
  };
</script>
</body>
</html>
